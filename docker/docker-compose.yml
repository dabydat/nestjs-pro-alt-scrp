name: pro_alt_scrp_app

services:
  postgres-db:
    container_name: postgres-db
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pro_alt_scrp
      POSTGRES_PASSWORD: pro_alt_scrp_password
      POSTGRES_DB: pro_alt_scrp
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - pro_alt_scrp_postgres:/var/lib/postgresql/data
    networks:
      - pro_alt_scrp_network
  
volumes:
  pro_alt_scrp_postgres:
    driver: local

networks:
  pro_alt_scrp_network:
    driver: bridge
